<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px "Microsoft YaHei", sans-serif; fill: white; }
      .sub { font: 400 18px "Microsoft YaHei", sans-serif; fill: #cbd5e1; }
      .layer { fill: white; stroke-width: 2.5; rx: 22; }
      .presentation { stroke: #0284c7; }
      .application { stroke: #2563eb; }
      .domain { stroke: #16a34a; }
      .infra { stroke: #9333ea; }
      .external { stroke: #ea580c; }
      .layer-title { font: 700 25px "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .module { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.8; rx: 13; }
      .module-name { font: 700 18px "Consolas", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 15px "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .note { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 15; }
      .note-text { font: 400 15px "Microsoft YaHei", sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect width="1800" height="1120" class="bg"/>
  <rect width="1800" height="120" fill="url(#head)"/>
  <text x="58" y="54" class="title">DjangoBlog 系统架构图</text>
  <text x="58" y="91" class="sub">分层架构 · Django App 模块 · 插件 Hook · 数据与外部服务</text>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="1690" height="155" class="layer presentation"/>
    <text x="85" y="205" class="layer-title">表现层 / Presentation</text>
    <rect x="300" y="225" width="210" height="68" class="module"/><text x="405" y="254" class="module-name">HTML Templates</text><text x="405" y="278" class="small">base / article / account</text>
    <rect x="550" y="225" width="210" height="68" class="module"/><text x="655" y="254" class="module-name">Template Tags</text><text x="655" y="278" class="small">blog / comments / oauth</text>
    <rect x="800" y="225" width="210" height="68" class="module"/><text x="905" y="254" class="module-name">Vite Frontend</text><text x="905" y="278" class="small">评论、导航、主题</text>
    <rect x="1050" y="225" width="210" height="68" class="module"/><text x="1155" y="254" class="module-name">Admin UI</text><text x="1155" y="278" class="small">内容与审核后台</text>
    <rect x="1300" y="225" width="360" height="68" class="module"/><text x="1480" y="254" class="module-name">Browser / Responsive UI</text><text x="1480" y="278" class="small">桌面端、移动端、AJAX / CSRF</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="365" width="1690" height="190" class="layer application"/>
    <text x="85" y="405" class="layer-title">接口层 / Interface</text>
    <rect x="300" y="430" width="230" height="88" class="module"/><text x="415" y="464" class="module-name">URL Router</text><text x="415" y="490" class="small">djangoblog/urls.py</text>
    <rect x="570" y="430" width="230" height="88" class="module"/><text x="685" y="464" class="module-name">Views</text><text x="685" y="490" class="small">List / Detail / Form / API</text>
    <rect x="840" y="430" width="230" height="88" class="module"/><text x="955" y="464" class="module-name">Forms</text><text x="955" y="490" class="small">校验、CSRF、字段清理</text>
    <rect x="1110" y="430" width="230" height="88" class="module"/><text x="1225" y="464" class="module-name">Mixins</text><text x="1225" y="490" class="small">查询优化、缓存、分页</text>
    <rect x="1380" y="430" width="280" height="88" class="module"/><text x="1520" y="464" class="module-name">Admin / Management Commands</text><text x="1520" y="490" class="small">后台操作、测试数据、索引</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="600" width="1690" height="190" class="layer domain"/>
    <text x="85" y="640" class="layer-title">业务层 / Domain Apps</text>
    <rect x="300" y="665" width="190" height="88" class="module"/><text x="395" y="699" class="module-name">blog</text><text x="395" y="725" class="small">文章、分类、标签</text>
    <rect x="520" y="665" width="190" height="88" class="module"/><text x="615" y="699" class="module-name">accounts</text><text x="615" y="725" class="small">用户、登录、密码</text>
    <rect x="740" y="665" width="190" height="88" class="module"/><text x="835" y="699" class="module-name">comments</text><text x="835" y="725" class="small">树形评论、Emoji</text>
    <rect x="960" y="665" width="190" height="88" class="module"/><text x="1055" y="699" class="module-name">oauth</text><text x="1055" y="725" class="small">第三方账户绑定</text>
    <rect x="1180" y="665" width="210" height="88" class="module"/><text x="1285" y="699" class="module-name">servermanager</text><text x="1285" y="725" class="small">机器人、运维命令</text>
    <rect x="1420" y="665" width="240" height="88" class="module"/><text x="1540" y="699" class="module-name">plugins / hooks</text><text x="1540" y="725" class="small">推荐、版权、SEO 等</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="835" width="1690" height="190" class="layer infra"/>
    <text x="85" y="875" class="layer-title">基础设施层 / Infrastructure</text>
    <rect x="300" y="900" width="230" height="88" class="module"/><text x="415" y="934" class="module-name">Django ORM</text><text x="415" y="960" class="small">Model / QuerySet / Signals</text>
    <rect x="570" y="900" width="230" height="88" class="module"/><text x="685" y="934" class="module-name">MySQL 8</text><text x="685" y="960" class="small">业务数据、utf8mb4</text>
    <rect x="840" y="900" width="230" height="88" class="module"/><text x="955" y="934" class="module-name">Cache</text><text x="955" y="960" class="small">LocalMem / Redis</text>
    <rect x="1110" y="900" width="230" height="88" class="module"/><text x="1225" y="934" class="module-name">Search</text><text x="1225" y="960" class="small">Whoosh / Elasticsearch</text>
    <rect x="1380" y="900" width="280" height="88" class="module"/><text x="1520" y="934" class="module-name">Mail / OAuth / Cloudflare</text><text x="1520" y="960" class="small">SMTP、第三方平台、CDN</text>
  </g>

  <path d="M900 320 V355" class="flow"/>
  <path d="M900 555 V590" class="flow"/>
  <path d="M900 790 V825" class="flow"/>

  <rect x="105" y="245" width="160" height="55" class="note"/>
  <text x="125" y="280" class="note-text">HTTP 请求 / 响应</text>
  <rect x="105" y="454" width="160" height="55" class="note"/>
  <text x="125" y="489" class="note-text">路由、权限与校验</text>
  <rect x="105" y="689" width="160" height="55" class="note"/>
  <text x="125" y="724" class="note-text">领域业务与插件</text>
  <rect x="105" y="924" width="160" height="55" class="note"/>
  <text x="125" y="959" class="note-text">持久化与外部调用</text>

  <text x="900" y="1080" text-anchor="middle" class="small">依赖方向：表现层 → 接口层 → 业务层 → 基础设施层；插件通过 Hook 在文章渲染、详情加载和缓存事件中扩展业务。</text>
</svg>
