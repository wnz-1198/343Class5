<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px "Microsoft YaHei", sans-serif; fill: white; }
      .sub { font: 400 18px "Microsoft YaHei", sans-serif; fill: #cbd5e1; }
      .card { fill: white; stroke: #e2e8f0; stroke-width: 2; rx: 20; }
      .number { font: 700 44px "Microsoft YaHei", sans-serif; fill: #1d4ed8; text-anchor: middle; }
      .label { font: 400 18px "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .section { font: 700 24px "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .bar-label { font: 400 17px "Microsoft YaHei", sans-serif; fill: #334155; }
      .value { font: 700 17px "Consolas", sans-serif; fill: #0f172a; }
      .axis { stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" class="bg"/>
  <rect width="1600" height="120" fill="url(#head)"/>
  <text x="58" y="54" class="title">DjangoBlog Python 代码质量扫描概览</text>
  <text x="58" y="91" class="sub">统计范围：src/DjangoBlog-master，排除 migrations 与第三方静态资源</text>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="330" height="150" class="card"/>
    <text x="220" y="230" class="number">127</text><text x="220" y="275" class="label">Python 文件</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="415" y="165" width="330" height="150" class="card"/>
    <text x="580" y="230" class="number">17,683</text><text x="580" y="275" class="label">总代码行</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="775" y="165" width="330" height="150" class="card"/>
    <text x="940" y="230" class="number">73</text><text x="940" y="275" class="label">超过 99 字符的行</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1135" y="165" width="410" height="150" class="card"/>
    <text x="1340" y="230" class="number">6,693</text><text x="1340" y="275" class="label">现有自动化测试代码行</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="360" width="720" height="470" class="card"/>
    <text x="90" y="410" class="section">全项目静态扫描结果</text>
    <line x1="300" y1="470" x2="300" y2="760" class="axis"/>
    <text x="90" y="500" class="bar-label">Python 文件</text>
    <rect x="300" y="475" width="300" height="34" fill="#2563eb" rx="8"/><text x="615" y="500" class="value">127</text>
    <text x="90" y="555" class="bar-label">代码行总数</text>
    <rect x="300" y="530" width="405" height="34" fill="#0891b2" rx="8"/><text x="720" y="555" class="value">17,683</text>
    <text x="90" y="610" class="bar-label">长行 >99</text>
    <rect x="300" y="585" width="100" height="34" fill="#f59e0b" rx="8"/><text x="415" y="610" class="value">73</text>
    <text x="90" y="665" class="bar-label">注释行</text>
    <rect x="300" y="640" width="380" height="34" fill="#16a34a" rx="8"/><text x="695" y="665" class="value">1,822</text>
    <text x="90" y="720" class="bar-label">测试文件</text>
    <rect x="300" y="695" width="150" height="34" fill="#7c3aed" rx="8"/><text x="465" y="720" class="value">21</text>
    <text x="90" y="785" class="label" text-anchor="start">注：行数为文本行统计，不等同于 SonarQube 的有效代码行。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="815" y="360" width="730" height="470" class="card"/>
    <text x="850" y="410" class="section">问题优先级分布</text>
    <rect x="890" y="465" width="520" height="54" fill="#fee2e2" rx="14"/>
    <rect x="890" y="465" width="110" height="54" fill="#dc2626" rx="14"/>
    <text x="850" y="500" class="bar-label">高</text><text x="920" y="500" style="font:700 20px Microsoft YaHei;fill:white">1</text>
    <text x="1020" y="500" class="bar-label">数据库默认密码写在仓库中</text>

    <rect x="890" y="550" width="520" height="54" fill="#ffedd5" rx="14"/>
    <rect x="890" y="550" width="290" height="54" fill="#ea580c" rx="14"/>
    <text x="850" y="585" class="bar-label">中</text><text x="925" y="585" style="font:700 20px Microsoft YaHei;fill:white">4</text>
    <text x="1040" y="585" class="bar-label">并发统计、健康检查、异常捕获、编码</text>

    <rect x="890" y="635" width="520" height="54" fill="#e0f2fe" rx="14"/>
    <rect x="890" y="635" width="440" height="54" fill="#0284c7" rx="14"/>
    <text x="850" y="670" class="bar-label">低</text><text x="925" y="670" style="font:700 20px Microsoft YaHei;fill:white">6</text>
    <text x="1030" y="670" class="bar-label">长行、命名、重复注释、测试可读性</text>

    <text x="850" y="750" class="section">个人精读范围：oauth</text>
    <text x="850" y="785" class="bar-label">12 个 Python 文件 · 1,855 行 · 10 条长行 · 43 条 SJL 个人注释</text>
  </g>
</svg>
